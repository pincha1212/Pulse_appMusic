name: Pulse Music Player - Auto Build & OTA Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish OTA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon || true

      - name: Find Output APK
        id: find_apk
        run: |
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "APK_PATH=app/build/outputs/apk/release/app-release-unsigned.apk" >> $GITHUB_OUTPUT
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
          else
            echo "APK_PATH=$(find app/build/outputs/apk -name '*.apk' | head -n 1)" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK Artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Music-Player-APK
          path: ${{ steps.find_apk.outputs.APK_PATH }}

      - name: Create GitHub Release for In-App OTA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v4.2.{0}', github.run_number) }}
          name: Pulse Music Player ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v4.2.{0}', github.run_number) }}
          body: |
            ## Pulse Music Player - Actualización Automática OTA
            - Compilación automática generada por GitHub Actions (JDK 21).
            - Versión integrada con instalador inalámbrico dentro de la app.
            - Incluye temporizador de apagado en ajustes y gestión de cola.
          draft: false
          prerelease: false
          files: ${{ steps.find_apk.outputs.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
